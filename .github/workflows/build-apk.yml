name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Android SDK (cmdline-tools + platform 35)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sS -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK instalado em $ANDROID_HOME"

      - name: Instalar dependencias npm
        working-directory: app
        run: npm ci

      - name: Sincronizar web para o projeto android
        working-directory: app
        run: npx cap sync android

      - name: Compilar APK (debug)
        id: build
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Publicar log de erro (se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxo-de-caixa-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error