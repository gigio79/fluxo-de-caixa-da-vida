name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Instalar dependencias npm
        working-directory: app
        run: npm ci

      - name: Sincronizar web para o projeto android
        working-directory: app
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxo-de-caixa-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error