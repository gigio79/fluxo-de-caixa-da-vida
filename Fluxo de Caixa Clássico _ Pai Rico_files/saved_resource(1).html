</style>
<script>
  (function () {
    function fitScreen() {
      var container = document.querySelector('.game-container');
      if (!container) return;
      var W = 1024, H = 768;
      var availW = window.innerWidth, availH = window.innerHeight;
      var k = Math.min(availW / W, availH / H);
      if (k > 1) k = 1;
      container.style.transform = 'scale(' + k + ')';
      container.style.left = Math.round((availW - W * k) / 2) + 'px';
      container.style.top = Math.round((availH - H * k) / 2) + 'px';
    }
    window.addEventListener('resize', fitScreen);
    window.addEventListener('orientationchange', fitScreen);
    window.addEventListener('load', fitScreen);
    fitScreen();
  })();
</script>
