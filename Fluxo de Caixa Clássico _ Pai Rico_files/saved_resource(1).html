<script>
  (function () {
    function fitScreen() {
      var container = document.querySelector('.game-container');
      if (!container) return;
      var W = 1024, H = 768;
      var availW = window.innerWidth, availH = window.innerHeight;
      var k = Math.min(availW / W, availH / H);
      if (k > 1) k = 1;
      container.style.transform = 'scale(' + k + ')';
      container.style.left = Math.round((availW - W * k) / 2) + 'px';
      container.style.top = Math.round((availH - H * k) / 2) + 'px';
    }
    window.addEventListener('resize', fitScreen);
    window.addEventListener('orientationchange', fitScreen);
    window.addEventListener('load', fitScreen);
    fitScreen();
  })();
</script>

<script>
  (function () {
    var chip = document.getElementById('cflow-player-chip');
    var modal = document.getElementById('cflow-player-modal');
    var input = document.getElementById('cflow-player-input');
    var sayGuest = 'Jogador ?  (toque p/ nome)';
    function label() {
      var nm = (window.settings && settings.gameHandle) || localStorage.getItem('cflow_name') || 'Visitante';
      chip.textContent = 'Jogador: ' + nm;
    }
    function open() {
      input.value = (window.settings && settings.gameHandle) || localStorage.getItem('cflow_name') || '';
      modal.hidden = false;
      input.focus();
    }
    function close() { modal.hidden = true; }
    function save() {
      var nm = input.value.trim();
      if (!nm) { nm = 'Visitante'; }
      localStorage.setItem('cflow_name', nm);
      if (window.settings) { settings.gameHandle = nm; }
      label();
      close();
    }
    chip.addEventListener('click', open);
    document.getElementById('cflow-player-ok').addEventListener('click', save);
    document.getElementById('cflow-player-cancel').addEventListener('click', close);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { save(); } });
    modal.addEventListener('click', function (e) { if (e.target === modal) { close(); } });
    label();
  })();
</script>
